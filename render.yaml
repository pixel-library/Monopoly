services:
  - type: web
    name: monopoly-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://monopoly-board-game.netlify.app
      - key: PORT
        value: 3001
